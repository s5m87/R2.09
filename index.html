
<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulaire de contact</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="page-wrapper">

      <!-- En-tête -->
      <header class="form-header">
        <div class="header-line" aria-hidden="true"></div>

        <h1>Nous contacter</h1>

        <p class="subtitle">
          Remplissez le formulaire ci-dessous — nous vous répondrons rapidement.
        </p>
      </header>

      <!-- Contenu principal -->
      <main>
        <form id="contactForm" action="#" method="post" novalidate>

          <!-- Pseudo -->
          <div class="field-group">

            <label for="pseudo">
              Pseudo
              <span class="required" aria-hidden="true">*</span>
            </label>

            <input
              type="text"
              id="pseudo"
              name="pseudo"
              placeholder="Votre pseudo"
              required
              autocomplete="username"
            />

          </div>

          <!-- Mot de passe -->
          <div class="field-group">

            <label for="password">
              Mot de passe
              <span class="required" aria-hidden="true">*</span>
            </label>

            <div class="input-wrapper">

              <input
                type="password"
                id="password"
                name="password"
                placeholder="Votre mot de passe"
                required
                autocomplete="current-password"
              />

              <button
                type="button"
                class="toggle-pwd"
                aria-label="Afficher ou masquer le mot de passe"
                aria-controls="password"
                onclick="togglePassword()"
              >

                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                  focusable="false"
                >
                  <path
                    d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"
                  />

                  <circle cx="12" cy="12" r="3" />
                </svg>

              </button>

            </div>

          </div>

          <!-- Email -->
          <div class="field-group">

            <label for="email">
              Adresse e-mail
              <span class="required" aria-hidden="true">*</span>
            </label>

            <input
              type="email"
              id="email"
              name="email"
              placeholder="exemple@domaine.fr"
              required
              autocomplete="email"
            />

          </div>

          <!-- Objet -->
          <div class="field-group">

            <label for="objet">
              Objet du message
              <span class="required" aria-hidden="true">*</span>
            </label>

            <div class="select-wrapper">

              <select
                id="objet"
                name="objet"
                required
              >

                <option value="" disabled selected>
                  -- Choisissez un objet --
                </option>

                <option value="question">
                  J'ai une question
                </option>

                <option value="suggestion">
                  Je fais une suggestion
                </option>

                <option value="probleme">
                  Je rencontre un problème
                </option>

                <option value="autre">
                  Autre
                </option>

              </select>

            </div>

          </div>

          <!-- Message -->
          <div class="field-group">

            <label for="message">
              Votre message
              <span class="required" aria-hidden="true">*</span>
            </label>

            <textarea
              id="message"
              name="message"
              rows="6"
              placeholder="Écrivez votre message ici..."
              required
            ></textarea>

          </div>

          <!-- Niveau d'urgence -->
          <fieldset class="field-group urgency-group">

            <legend>
              Niveau d'urgence
              <span class="required" aria-hidden="true">*</span>
            </legend>

            <div class="radio-row">

              <div class="radio-option">

                <input
                  type="radio"
                  id="urgence-lent"
                  name="urgence"
                  value="lent"
                  checked
                />

                <label for="urgence-lent">
                  Lent
                </label>

              </div>

              <div class="radio-option">

                <input
                  type="radio"
                  id="urgence-normal"
                  name="urgence"
                  value="normal"
                />

                <label for="urgence-normal">
                  Normal
                </label>

              </div>

              <div class="radio-option">

                <input
                  type="radio"
                  id="urgence-urgent"
                  name="urgence"
                  value="urgent"
                />

                <label for="urgence-urgent">
                  Urgent
                </label>

              </div>

              <div class="radio-option">

                <input
                  type="radio"
                  id="urgence-critique"
                  name="urgence"
                  value="critique"
                />

                <label for="urgence-critique">
                  Critique
                </label>

              </div>

            </div>

          </fieldset>

          <!-- Politique de confidentialité -->
          <div class="field-group checkbox-group">

            <div class="checkbox-option">

              <input
                type="checkbox"
                id="privacy"
                name="privacy"
                required
              />

              <label for="privacy">

                J'ai lu et j'accepte la

                <a href="#" class="privacy-link">
                  politique de confidentialité
                </a>

                <span class="required" aria-hidden="true">*</span>

              </label>

            </div>

          </div>

          <!-- Information champs obligatoires -->
          <p class="required-note">
            <span class="required" aria-hidden="true">*</span>
            Champs obligatoires
          </p>

          <!-- Boutons -->
          <div class="form-actions">

            <button type="reset" class="btn btn-reset">
              Réinitialiser
            </button>

            <button type="submit" class="btn btn-submit">
              Envoyer le message
            </button>

          </div>

        </form>
      </main>

      <!-- Pied de page -->
      <footer class="form-footer">
        <p>
          R209 — Travaux Pratiques HTML &amp; CSS · Christophe Vallot
        </p>
      </footer>

    </div>

    <script>
      function togglePassword() {
        const input = document.getElementById("password");

        input.type =
          input.type === "password"
            ? "text"
            : "password";
      }

      // Empêche le rechargement de la page
      document
        .getElementById("contactForm")
        .addEventListener("submit", function (event) {
          event.preventDefault();
        });
    </script>

  </body>
</html>
